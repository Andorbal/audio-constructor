[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
    "crates/ac-core",
    "crates/ac-dsp",
    "crates/ac-nodes",
    "crates/ac-engine",
    "crates/ac-io",
    "crates/ac-cli",
    "crates/ac-app",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Andorbal/audio-constructor"
authors = ["Audio Constructor contributors"]

[workspace.dependencies]
ac-core = { path = "crates/ac-core" }
ac-dsp = { path = "crates/ac-dsp" }
ac-nodes = { path = "crates/ac-nodes" }
ac-engine = { path = "crates/ac-engine" }
ac-io = { path = "crates/ac-io" }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rtrb = "0.4"
assert_no_alloc = "1.1"
hound = "3.5"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
cpal = "0.18"
midir = "0.11"
realfft = "3.5"
ctrlc = "3.5"
thread-priority = "3.1"
eframe = "0.37"
egui = "0.37"
egui_kittest = "0.37"
criterion = { version = "0.8", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# DSP in debug builds is painfully slow; optimize dependencies and a little of our own code.
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
debug = "line-tables-only"
