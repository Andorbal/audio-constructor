name: Release

# Every merge request raises the workspace version and adds its section to
# CHANGELOG.md (CLAUDE.md; CI's "Version and changelog" job enforces it). Once
# CI passes on a main commit whose version has no tag yet, this builds the
# binaries and publishes them as release vX.Y.Z, tagged at that commit, with
# the changelog section as the notes. Re-running is safe: a tagged version is
# skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Releases main's current version if it has no tag yet (e.g. after a failed run).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    # Only green pushes to this repository's main. workflow_run also fires for
    # pull requests, including ones from forks whose branch is called main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        run: |
          version=$(python3 scripts/release.py version)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
          case $status in
            0)
              echo "v$version is already released; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
            2)
              # Fail here, before building, if the notes are missing.
              python3 scripts/release.py notes "$version" > /dev/null
              echo "Releasing v$version from $(git rev-parse --short HEAD)." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "release=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::couldn't list the remote's tags (git ls-remote exited $status)"
              exit 1
              ;;
          esac

  build:
    name: Build (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      # Signing happens when these secrets exist (docs/guide/install.md,
      # "Signed builds"); without them the packages are built unsigned.
      HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Use an installed NSIS if there is one; otherwise install it, retrying
        # (the package feed throttles CI runners), and fail here rather than
        # later if makensis still isn't there.
        run: |
          $dirs = @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS")
          function Find-Nsis { $dirs | Where-Object { Test-Path (Join-Path $_ "makensis.exe") } | Select-Object -First 1 }
          $found = Find-Nsis
          for ($i = 1; -not $found -and $i -le 4; $i++) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Host "choco exited with $LASTEXITCODE (attempt $i)"; Start-Sleep -Seconds (10 * $i) }
            $found = Find-Nsis
          }
          if (-not $found) { Write-Error "makensis.exe isn't installed"; exit 1 }
          Write-Host "NSIS is in $found"
          $found | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: rustup show
      - name: Put the signing identities in a keychain (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(openssl rand -base64 24)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          rm "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
      - name: Put the signing certificate in a file (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          "WINDOWS_CERTIFICATE=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
      # An explicit target fails the build, rather than mislabeling the
      # packages, if a runner image ever changes architecture. The release
      # profile's line tables would make the Linux editor ~170 MB; dropping
      # them (symbols stay, so backtraces still name functions) makes it ~35.
      - name: Build and package
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/package.py --build --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.pkg
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    name: Publish v${{ needs.plan.outputs.version }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          python3 scripts/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          gh release create "v$VERSION" dist/* \
            --target "$SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "Published [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION)." >> "$GITHUB_STEP_SUMMARY"
