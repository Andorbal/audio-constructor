name: CI

on:
  push:
    # Work branches get CI on every push, before a merge request exists.
    branches: [main, "claude/**", "phase-*/**"]
  pull_request:

concurrency:
  # Each commit on main gets its own group so every one runs to completion: a
  # green run on main is what releases it (release.yml).
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  version:
    name: Version and changelog
    # Every merge request releases a new version (CLAUDE.md); main is the base
    # it's checked against, so there's nothing to check on main itself.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/release.py check --base "origin/${{ github.base_ref || 'main' }}"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm:
    name: wasm32 check (engine crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ac-core -p ac-dsp -p ac-nodes -p ac-engine --target wasm32-unknown-unknown

  web:
    name: Web build and browser test
    # Builds the static site (the editor, the audio worklet, the examples),
    # then opens it in headless Chromium and plays the Start, Pedalboard
    # (with a fake microphone), and Synth examples (tests/web/e2e.cjs). The
    # site is uploaded as the `web-site` artifact; pages.yml publishes
    # main's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen's command line (the version in Cargo.lock)
        run: |
          v=$(python3 -c 'import re; print(re.search(r"name = \"wasm-bindgen\"\nversion = \"([^\"]+)\"", open("Cargo.lock").read()).group(1))')
          if [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" != "$v" ]; then
            cargo install wasm-bindgen-cli --version "$v" --locked
          fi
      - name: Clippy on the page's and the worklet's builds
        run: |
          cargo clippy -p ac-web --target wasm32-unknown-unknown --features ui -- -D warnings
          cargo clippy -p ac-web --target wasm32-unknown-unknown --features worklet -- -D warnings
      - name: Build the site
        run: python3 scripts/build_web.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and its Chromium
        working-directory: tests/web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Play the examples in the browser
        run: node tests/web/e2e.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: target/web/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-screenshots
          path: target/web-e2e/
          if-no-files-found: ignore

  jack:
    name: JACK build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries and a JACK server
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libjack-jackd2-dev jackd2
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p ac-io -p ac-cli -p ac-app --all-targets --features ac-io/jack,ac-cli/jack,ac-app/jack -- -D warnings
      - name: Start JACK with its dummy driver
        run: |
          jackd --no-realtime -d dummy -r 48000 -p 256 > jackd.log 2>&1 &
          for _ in $(seq 50); do jack_lsp > /dev/null 2>&1 && break; sleep 0.2; done
          jack_lsp
      - name: Run the engine on JACK
        run: cargo test -p ac-io --features jack --test backends -- --ignored
      - name: Run a project on JACK from the command line
        run: |
          cargo run -p ac-cli --features jack -- devices | tee devices.txt
          grep -q '^JACK' devices.txt
          cargo run -p ac-cli --features jack -- run examples/start.acproj --host jack --duration 1 | tee run.txt
          grep -q '^audio: JACK' run.txt

  asio:
    name: ASIO build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Without CPAL_ASIO_DIR the build downloads the ASIO SDK from Steinberg;
      # bindgen uses the runner's LLVM. Nothing built here is distributed.
      - run: cargo build -p ac-cli -p ac-app --features ac-cli/asio,ac-app/asio
      - run: cargo test -p ac-io --features asio --test backends
      - name: The ASIO host is listed
        shell: bash
        run: |
          cargo run -p ac-cli --features asio -- devices | tee devices.txt
          grep -q '^ASIO' devices.txt

  plugin:
    name: Bundles and installers (${{ matrix.os }})
    # The test job already runs the plugin's tests on a debug build (a real
    # CLAP host loads it, aborting on audio-thread allocations); this one
    # builds what a release ships: the .clap and .vst3 bundles (running the
    # same host tests against the binary inside them), then the programs
    # and each platform's archive and installer, which it installs, runs,
    # and uninstalls again.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # As release.yml builds them: symbols but no line tables.
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
    steps:
      - uses: actions/checkout@v4
      # The editor links the device layer (ALSA, udev); xvfb and Mesa's GLX
      # give the window test below a display and OpenGL to open the editor on.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev xvfb libgl1 libglx-mesa0 libgl1-mesa-dri mesa-utils
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # An installed NSIS if the image has one; otherwise NSIS's own
        # portable release, pinned by its SHA-256 (no package feed, which
        # throttles and goes down; no installer). Fails here, not later.
        run: |
          $dirs = @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS")
          $found = $dirs | Where-Object { Test-Path (Join-Path $_ "makensis.exe") } | Select-Object -First 1
          if (-not $found) {
            $zip = Join-Path $env:RUNNER_TEMP "nsis-3.11.zip"
            curl.exe -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o $zip "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip"
            if ($LASTEXITCODE -ne 0) { Write-Error "couldn't download NSIS ($LASTEXITCODE)"; exit 1 }
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
            if ($hash -ne "C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1") { Write-Error "NSIS download has SHA-256 $hash, not the pinned one"; exit 1 }
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
            $found = Join-Path $env:RUNNER_TEMP "nsis-3.11"
          }
          if (-not (Test-Path (Join-Path $found "makensis.exe"))) { Write-Error "makensis.exe isn't in $found"; exit 1 }
          Write-Host "NSIS is in $found"
          $found | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build the bundles
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/bundle_plugin.py
      - name: Run the host tests against the bundled binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            lib="target/bundled/Audio Constructor.clap/Contents/MacOS/Audio Constructor"
          else
            lib="target/bundled/Audio Constructor.clap"
          fi
          # Windows tools need a Windows path; Git Bash's `pwd -W` gives one.
          root=$(pwd -W 2>/dev/null || pwd)
          AC_PLUGIN_LIBRARY="$root/$lib" cargo test -p ac-plugin --test clap_host --test vst3_factory
      - name: Open the editor in a host window (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          # The plugin logs why a window couldn't open to stderr.
          NICE_LOG: stderr
          AC_PLUGIN_LIBRARY: ${{ github.workspace }}/target/bundled/Audio Constructor.clap
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" sh -c \
            'glxinfo -B && cargo test -p ac-plugin --test clap_host -- --ignored'
      - name: Build the programs
        run: cargo build --release --locked -p ac-cli -p ac-app
      - name: Package
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/package.py --out dist
      - name: Install, run, and remove the .deb and the tarball (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/audio-constructor_*.deb
          audioc --version
          audio-constructor --version
          test -f "/usr/lib/clap/Audio Constructor.clap"
          test -d "/usr/lib/vst3/Audio Constructor.vst3"
          test -f /usr/share/audio-constructor/examples/start.acproj
          test -f /usr/share/applications/audio-constructor.desktop
          audioc render /usr/share/audio-constructor/examples/start.acproj -o "$RUNNER_TEMP/start.wav" --to 1 -q
          sudo apt-get remove -y audio-constructor
          test ! -e /usr/bin/audioc
          # The per-user install, into a scratch home.
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME" "$RUNNER_TEMP/tarball"
          tar -xzf dist/audio-constructor-v*.tar.gz -C "$RUNNER_TEMP/tarball"
          "$RUNNER_TEMP"/tarball/*/install.sh
          "$HOME/.local/bin/audioc" --version
          test -f "$HOME/.clap/Audio Constructor.clap"
          test -f "$HOME/.local/share/audio-constructor/examples/start.acproj"
          "$RUNNER_TEMP"/tarball/*/install.sh --uninstall
          test ! -e "$HOME/.local/bin/audioc"
      - name: Install, run, and remove the .pkg (macOS)
        if: runner.os == 'macOS'
        run: |
          pkg=$(ls dist/*.pkg)
          pkgutil --check-signature "$pkg" || true
          sudo installer -pkg "$pkg" -target /
          app="/Applications/Audio Constructor.app"
          "$app/Contents/MacOS/audio-constructor" --version
          /usr/local/bin/audioc --version
          plutil -lint "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/examples/start.acproj"
          test -d "/Library/Audio/Plug-Ins/CLAP/Audio Constructor.clap"
          test -d "/Library/Audio/Plug-Ins/VST3/Audio Constructor.vst3"
          audioc render "$app/Contents/Resources/examples/start.acproj" -o "$RUNNER_TEMP/start.wav" --to 1 -q
      - name: Install, run, and remove the setup program (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\ac-install"
          # /D must come last and unquoted.
          $run = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          if ($run.ExitCode -ne 0) { Write-Error "setup exited with $($run.ExitCode)"; exit 1 }
          & "$dir\audioc.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$dir\audio-constructor.exe" --version | Out-Host
          foreach ($p in @("$dir\examples\start.acproj", "$env:CommonProgramFiles\CLAP\Audio Constructor.clap", "$env:CommonProgramFiles\VST3\Audio Constructor.vst3")) {
            if (-not (Test-Path $p)) { Write-Error "missing $p"; exit 1 }
          }
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\AudioConstructor"
          if ((Get-ItemProperty $key).DisplayName -ne "Audio Constructor") { Write-Error "no uninstall entry"; exit 1 }
          & "$dir\audioc.exe" render "$dir\examples\start.acproj" -o "$env:RUNNER_TEMP\start.wav" --to 1 -q
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # `_?=` runs the uninstaller in place, so this waits for it.
          $run = Start-Process -FilePath "$dir\uninstall.exe" -ArgumentList "/S", "_?=$dir" -Wait -PassThru
          if ($run.ExitCode -ne 0) { Write-Error "uninstall exited with $($run.ExitCode)"; exit 1 }
          foreach ($p in @("$dir\audioc.exe", "$env:CommonProgramFiles\CLAP\Audio Constructor.clap", $key)) {
            if (Test-Path $p) { Write-Error "still there: $p"; exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-bundles-${{ matrix.os }}
          path: target/bundled/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.pkg
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  third-party-plugin:
    name: Third-party plugin as a node (Linux)
    # Phase 3 acceptance: "A third-party CLAP synth runs as a node inside a
    # project" (and the same synth's VST3 build, for VST3 hosting). Six Sines
    # (an FM synth; MIT source, and its release archive
    # carries GPL-3.0 for the bundled binaries) is downloaded at a pinned
    # release, checked against its SHA-256, and only run here: never linked
    # or redistributed (DECISIONS D136).
    runs-on: ubuntu-latest
    env:
      SIX_SINES_URL: https://github.com/baconpaul/six-sines/releases/download/v1.2.1/six-sines-Linux-2026-07-20-18ecb36.zip
      SIX_SINES_SHA256: 9b5353eebfec3e462c80ed8c0f53c965e6262bb38537518159cce71de7eace41
    steps:
      - uses: actions/checkout@v4
      # Mesa's GLX: our own instrument's window draws with OpenGL.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libfontconfig1 libfreetype6 unzip xvfb libgl1 libglx-mesa0 libgl1-mesa-dri mesa-utils gdb
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Cache the plugin download
        uses: actions/cache@v4
        with:
          path: third-party/six-sines.zip
          key: six-sines-${{ env.SIX_SINES_SHA256 }}
      - name: Download and verify the plugin
        run: |
          mkdir -p third-party
          if [ ! -f third-party/six-sines.zip ]; then
            curl -fsSL --retry 3 -o third-party/six-sines.zip "$SIX_SINES_URL"
          fi
          echo "$SIX_SINES_SHA256  third-party/six-sines.zip" | sha256sum -c -
          unzip -q -o third-party/six-sines.zip -d third-party
          ls -R third-party/six-sines_assets
      - name: Play it as a node in a project
        env:
          AC_THIRD_PARTY_PLUGINS: ${{ github.workspace }}/third-party/six-sines_assets
          AC_THIRD_PARTY_NAME: Six Sines
          AC_THIRD_PARTY_FORMATS: clap,vst3
        run: cargo test -p ac-cli --test third_party_plugins -- --ignored --nocapture
      - name: Open its window, and ours, in the host's window (virtual display)
        env:
          AC_THIRD_PARTY_PLUGINS: ${{ github.workspace }}/third-party/six-sines_assets
          AC_THIRD_PARTY_NAME: Six Sines
          AC_THIRD_PARTY_FORMATS: clap,vst3
          # Our plugin logs why a window couldn't open to stderr.
          NICE_LOG: stderr
          # Plugin code runs in the test process: if it crashes, gdb prints
          # every thread's stack and the loaded libraries, and the step still
          # fails with the crash.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: gdb -q -batch -x ${{ runner.temp }}/backtrace.gdb --args
        run: |
          cat > "$RUNNER_TEMP/backtrace.gdb" <<'EOF'
          set pagination off
          set confirm off
          set print thread-events off
          set disable-randomization off
          run
          if $_isvoid($_exitcode)
            echo \n=== crashed: backtraces ===\n
            thread apply all bt 40
            info sharedlibrary
            kill
            quit 134
          else
            quit $_exitcode
          end
          EOF
          xvfb-run -a -s "-screen 0 1280x1024x24" sh -c 'glxinfo -B &&
            cargo test -p ac-host --test third_party_window -- --ignored --nocapture &&
            cargo test -p ac-host --test plugin_window -- --ignored --nocapture'

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  bench:
    name: Bench (vs. base branch)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Bench the base branch
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          if [ -f ../base/crates/ac-cli/src/bench.rs ]; then
            (cd ../base && cargo build --release -p ac-cli && ./target/release/audioc bench --seconds 5 --repeat 3 --json > ../base-bench.json)
          else
            echo "The base branch has no bench yet; nothing to compare against."
          fi
      - name: Bench this branch and compare (fails on a >20 % slowdown)
        run: |
          cargo build --release -p ac-cli
          if [ -f ../base-bench.json ]; then
            ./target/release/audioc bench --seconds 5 --repeat 3 --compare ../base-bench.json --threshold 0.2
          else
            ./target/release/audioc bench --seconds 5 --repeat 3
          fi
