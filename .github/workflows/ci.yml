name: CI

on:
  push:
    # Work branches get CI on every push, before a merge request exists.
    branches: [main, "claude/**", "phase-*/**"]
  pull_request:

concurrency:
  # Each commit on main gets its own group so every one runs to completion: a
  # green run on main is what releases it (release.yml).
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  version:
    name: Version and changelog
    # Every merge request releases a new version (CLAUDE.md); main is the base
    # it's checked against, so there's nothing to check on main itself.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/release.py check --base "origin/${{ github.base_ref || 'main' }}"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm:
    name: wasm32 check (engine crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ac-core -p ac-dsp -p ac-nodes -p ac-engine --target wasm32-unknown-unknown

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  bench:
    name: Bench (vs. base branch)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Bench the base branch
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          if [ -f ../base/crates/ac-cli/src/bench.rs ]; then
            (cd ../base && cargo build --release -p ac-cli && ./target/release/audioc bench --seconds 5 --repeat 3 --json > ../base-bench.json)
          else
            echo "The base branch has no bench yet; nothing to compare against."
          fi
      - name: Bench this branch and compare (fails on a >20 % slowdown)
        run: |
          cargo build --release -p ac-cli
          if [ -f ../base-bench.json ]; then
            ./target/release/audioc bench --seconds 5 --repeat 3 --compare ../base-bench.json --threshold 0.2
          else
            ./target/release/audioc bench --seconds 5 --repeat 3
          fi
