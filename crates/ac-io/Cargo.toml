[package]
name = "ac-io"
description = "Device and file layer for Audio Constructor: audio, MIDI, gamepad, and OSC devices, WAV files, recording."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# JACK audio (Linux, and Windows/macOS where JACK is installed). Off by
# default: building needs the JACK development files (`jack.pc` for
# pkg-config), and running needs a JACK or PipeWire-JACK server.
jack = ["cpal/jack"]
# ASIO on Windows. Off by default: building needs the Steinberg ASIO SDK
# (point `CPAL_ASIO_DIR` at it) and LLVM for bindgen, and distributing
# binaries needs a license from Steinberg. See ARCHITECTURE §11.
asio = ["cpal/asio"]

[dependencies]
ac-core.workspace = true
ac-engine.workspace = true
hound.workspace = true
# `realtime` asks the OS for real-time scheduling on the device callback
# threads (MMCSS on Windows; without D-Bus it does nothing on Linux, see
# `priority.rs`).
cpal = { workspace = true, features = ["realtime"] }
midir.workspace = true
gilrs.workspace = true
rosc.workspace = true
rtrb.workspace = true
assert_no_alloc.workspace = true
realfft.workspace = true
flate2.workspace = true
crc32fast.workspace = true
serde_json.workspace = true
web-time.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# SCHED_FIFO for the ALSA callback thread.
thread-priority.workspace = true

[dev-dependencies]
ac-nodes.workspace = true
