[package]
name = "ac-app"
description = "The Audio Constructor editor: the desktop app, and the editor a plugin window embeds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "ac_app"
path = "src/lib.rs"

[[bin]]
name = "audio-constructor"
path = "src/main.rs"
required-features = ["desktop"]

[lints]
workspace = true

[features]
default = ["desktop"]
# The desktop editor: its own window (eframe, on winit and wgpu) and the
# system's file dialogs. Without it the editor still builds for a host that
# gives it somewhere to draw: a plugin window or a test harness.
desktop = ["dep:eframe", "native-dialogs"]
# The system's file dialogs. Without them the editor asks for a typed path.
native-dialogs = ["dep:rfd"]
# Opening the editor in a window a plugin host provides (`ac_app::embed`:
# egui-baseview, drawn with OpenGL).
embed = ["dep:egui-baseview", "dep:raw-window-handle"]
# Audio backends that need extra system pieces at build time (see ac-io).
jack = ["ac-io/jack"]
asio = ["ac-io/asio"]

[dependencies]
ac-core.workspace = true
ac-dsp.workspace = true
ac-nodes.workspace = true
ac-engine.workspace = true
ac-io.workspace = true
eframe = { workspace = true, optional = true }
# egui's own fonts back up the bundled ones (symbols Inter lacks); eframe
# turns them on for the desktop, and a plugin window needs them too.
egui = { workspace = true, features = ["default_fonts"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# The XDG portal on Linux. Not `wayland` (on by default): it only parents
# dialogs to Wayland windows, which the editor doesn't ask for, and it
# would link libwayland-client in builds without eframe (the plugin).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"], optional = true }
directories = "6.0"
web-time.workspace = true
# The plugin window: egui on baseview (MIT OR Apache-2.0), with the OpenGL
# renderer (DECISIONS D125). It needs a logging facade to build; `log` is
# the one plugin frameworks route to the host's log.
egui-baseview = { version = "0.9", default-features = false, features = ["opengl", "log"], optional = true }
raw-window-handle = { version = "0.6", optional = true }

[dev-dependencies]
egui_kittest.workspace = true

# Opens the plugin window adapter in a window of its own, with no host.
[[example]]
name = "embedded"
required-features = ["embed"]
