[package]
name = "ac-app"
description = "The Audio Constructor editor: the desktop app, and the editor a plugin window embeds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "ac_app"
path = "src/lib.rs"

[[bin]]
name = "audio-constructor"
path = "src/main.rs"
required-features = ["desktop"]

[lints]
workspace = true

[features]
default = ["desktop"]
# The desktop editor: its own window (eframe, on winit and wgpu) and the
# system's file dialogs. Without it the editor still builds for a host that
# gives it somewhere to draw: a plugin window or a test harness.
desktop = ["dep:eframe", "native-dialogs"]
# The system's file dialogs. Without them the editor asks for a typed path.
native-dialogs = ["dep:rfd"]
# Audio backends that need extra system pieces at build time (see ac-io).
jack = ["ac-io/jack"]
asio = ["ac-io/asio"]

[dependencies]
ac-core.workspace = true
ac-dsp.workspace = true
ac-nodes.workspace = true
ac-engine.workspace = true
ac-io.workspace = true
eframe = { workspace = true, optional = true }
egui.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd = { version = "0.17", optional = true }
directories = "6.0"

[dev-dependencies]
egui_kittest.workspace = true
